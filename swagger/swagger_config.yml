# swagger/swagger_config.yml
swagger: "2.0"
info:
  title: Catalog Manager API
  version: 1.0.0
  description: API documentation for Catalog Manager backend with JWT authentication
host: localhost:5000
basePath: /
schemes:
  - http
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: |
      JWT Authorization header using the Bearer scheme.
      Example: "Authorization: Bearer {token}"
security:
  - Bearer: []
tags:
  - name: Catalog
    description: Catalog related endpoints
  - name: Authentication
    description: User authentication endpoints
